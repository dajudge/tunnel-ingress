internalPrivateIp: 10.42.0.1
externalPrivateIp: 10.42.0.2
host: ip or hostname of the external host
sshKeySecret: ssh-key
pingSecret:
  name: ping-secret
  key: url
tag: 0.0.10
ports:
  - exposedPort: 80
    targetIp: someIp
    targetPort: 30080
    protocol: tcp
  - exposedPort: 443
    targetIp: someIp
    targetPort: 30443
    protocol: udp

# Optional additional HTTP requests, expressed as native curl configuration.
# Keep pingSecret unchanged for the existing URL-only request.
pingConfigSecret:
  name: ""
  key: config
