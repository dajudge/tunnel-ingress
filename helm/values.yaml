internalPrivateIp: 10.42.0.1
externalPrivateIp: 10.42.0.2
host: ip or hostname of the external host
sshKeySecret: ssh-key
pingSecret:
  name: ping-secret
  key: url
tag: 0.0.9
ports:
  - exposedPort: 80
    targetIp: someIp
    targetPort: 30080
    protocol: tcp
  - exposedPort: 443
    targetIp: someIp
    targetPort: 30443
    protocol: udp

# Optional parallel Cloudflare writer for the same public host as remote-ping.
# Enabling this does not change the existing tunnel Deployment or dogado updater.
cloudflareDdns:
  enabled: false
  dryRun: true
  image: python:3.14-alpine@sha256:5862d971d1f0ae26b258cefa4e893556b1d3aba81bd2ff30888704ad378bab67
  zoneId: ""
  recordId: ""
  recordName: ""
  existingSecret: cloudflare-api-token
  intervalSeconds: 60
