{{- if .Values.cloudflareDdns.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflare-ddns
  namespace: {{ .Release.Namespace }}
data:
  update.py: |
{{ .Files.Get "files/cloudflare-ddns/update.py" | indent 4 }}
  health.sh: |
{{ .Files.Get "files/cloudflare-ddns/health.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-ddns
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: cloudflare-ddns}
  template:
    metadata:
      labels: {app: cloudflare-ddns}
      annotations:
        checksum/script: {{ print (.Files.Get "files/cloudflare-ddns/update.py") (.Files.Get "files/cloudflare-ddns/health.sh") | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: updater
          image: {{ .Values.cloudflareDdns.image | quote }}
          command: [python3, -I, -S, -B, /app/update.py]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: TOKEN_FILE, value: /token/api-token}
            - {name: ZONE_ID, value: {{ required "zoneId is required" .Values.cloudflareDdns.zoneId | quote }}}
            - {name: RECORD_ID, value: {{ required "recordId is required" .Values.cloudflareDdns.recordId | quote }}}
            - {name: RECORD_NAME, value: {{ required "recordName is required" .Values.cloudflareDdns.recordName | quote }}}
            - {name: TUNNEL_HOST, value: {{ required "tunnelHost is required" .Values.host | quote }}}
            - {name: DRY_RUN, value: {{ .Values.cloudflareDdns.dryRun | toString | quote }}}
            - {name: INTERVAL_SECONDS, value: {{ .Values.cloudflareDdns.intervalSeconds | toString | quote }}}
          readinessProbe:
            exec:
              command: [sh, /app/health.sh]
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 10
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: script, mountPath: /app, readOnly: true}
            - {name: token, mountPath: /token, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: script
          configMap: {name: cloudflare-ddns}
        - name: token
          secret:
            secretName: {{ required "cloudflareDdns.existingSecret is required" .Values.cloudflareDdns.existingSecret | quote }}
            defaultMode: 0440
        - name: state
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
{{- end }}
