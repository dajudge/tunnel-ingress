{{- define "ports.list" -}}
{{- if .Values.ports }}
{{- range .Values.ports }}{{(print .exposedPort ":" .targetIp ":" .targetPort ":" .protocol ) }},{{- end }}
{{- end }}
{{- end }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tunnel-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    app: tunnel-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tunnel-ingress
  template:
    metadata:
      labels:
        app: tunnel-ingress
    spec:
      volumes:
        - name: ssh-key
          secret:
            secretName: ssh-key
            defaultMode: 0400
      initContainers:
        - name: tunnel-setup
          image: dajudge/tunnel-ingress:{{ .Values.tag }}
          volumeMounts:
            - name: ssh-key
              mountPath: /ssh-key/
          securityContext:
            privileged: true
          command: ["/scripts/tunnel-setup.sh"]
          env:
            - name: INTERNAL_PRIVATE_IP
              value: {{ .Values.internalPrivateIp }}
            - name: EXTERNAL_PRIVATE_IP
              value: {{ .Values.externalPrivateIp }}
            - name: PORTS
              value: '{{- include "ports.list" . | trimSuffix "," }}'
            - name: HOST
              value: {{ .Values.host }}
      containers:
        - name: remote-ping
          image: dajudge/tunnel-ingress:{{ .Values.tag }}
          volumeMounts:
            - name: ssh-key
              mountPath: /ssh-key/
              readOnly: true
          command: ["/scripts/remote-ping.sh"]
          env:
            - name: HOST
              value: {{ .Values.host }}
            - name: PING_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pingSecret.name }}
                  key: {{ .Values.pingSecret.key }}

            {{- if .Values.cloudflareDdns.enabled }}
            - name: CF_DDNS_ENABLED
              value: "true"
            - name: CF_DRY_RUN
              value: {{ .Values.cloudflareDdns.dryRun | toString | quote }}
            - name: CF_ZONE_ID
              value: {{ required "cloudflareDdns.zoneId is required" .Values.cloudflareDdns.zoneId | quote }}
            - name: CF_RECORD_ID
              value: {{ required "cloudflareDdns.recordId is required" .Values.cloudflareDdns.recordId | quote }}
            - name: CF_RECORD_NAME
              value: {{ required "cloudflareDdns.recordName is required" .Values.cloudflareDdns.recordName | quote }}
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.cloudflareDdns.tokenSecret.name | quote }}
                  key: {{ .Values.cloudflareDdns.tokenSecret.key | quote }}
                  optional: true
            {{- end }}
